name: GrantSupport CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Build, Vet, Test & Race Detector Matrix (Go ${{ matrix.go_version }} / PG 16 / MySQL ${{ matrix.mysql_version }} / MariaDB ${{ matrix.mariadb_version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - go_version: "1.26"
            mysql_version: "8.4"
            mariadb_version: "11.4"
          - go_version: "1.26"
            mysql_version: "8.0"
            mariadb_version: "10.5"
          - go_version: "1.27"
            mysql_version: "8.4"
            mariadb_version: "11.4"
          - go_version: "1.27"
            mysql_version: "8.0"
            mariadb_version: "10.5"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grantsupport
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: grantsupport
          POSTGRES_INITDB_ARGS: "-c max_connections=200"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantsupport -d grantsupport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:${{ matrix.mysql_version }}
        env:
          MYSQL_ROOT_PASSWORD: rootsecret
          MYSQL_DATABASE: grantsupport
          MYSQL_USER: grantsupport
          MYSQL_PASSWORD: secretpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u grantsupport -psecretpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mariadb:
        image: mariadb:${{ matrix.mariadb_version }}
        env:
          MARIADB_ROOT_PASSWORD: rootsecret
          MARIADB_DATABASE: grantsupport
          MARIADB_USER: grantsupport
          MARIADB_PASSWORD: secretpassword
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}
          cache: true

      - name: Go Formatting Check (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go source files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Mod Tidy & Download
        run: |
          go mod tidy
          go mod download

      - name: Compile Verification (go build)
        run: go build -v ./...

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Verify Live Database Connectivity (Fail if Unreachable)
        run: |
          for port in 5432 3306 3307; do
            nc -z localhost "$port" || { echo "Error: database service on localhost:$port is unreachable"; exit 1; }
          done

      - name: Unit, Concurrency & Cross-Database Matrix Suite (go test)
        env:
          TEST_POSTGRES_URL: postgresql://grantsupport:secretpassword@localhost:5432/grantsupport?sslmode=disable
          TEST_MYSQL_URL: grantsupport:secretpassword@tcp(localhost:3306)/grantsupport?parseTime=true
          TEST_MARIADB_URL: grantsupport:secretpassword@tcp(localhost:3307)/grantsupport?parseTime=true
          VALKEY_CACHE_URL: valkey://localhost:6379/0
        run: go test -p 1 -count=1 ./...

      - name: Race Detection Suite (go test -race)
        env:
          TEST_POSTGRES_URL: postgresql://grantsupport:secretpassword@localhost:5432/grantsupport?sslmode=disable
          TEST_MYSQL_URL: grantsupport:secretpassword@tcp(localhost:3306)/grantsupport?parseTime=true
          TEST_MARIADB_URL: grantsupport:secretpassword@tcp(localhost:3307)/grantsupport?parseTime=true
          VALKEY_CACHE_URL: valkey://localhost:6379/0
        run: go test -race -p 1 -count=1 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Multi-Arch Docker Build (amd64, arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile .
